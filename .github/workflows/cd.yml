name: Deploy workflow

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: deploy ts project
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Building the app
        run: npm run build

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: build the Docker image and push it to Google Artifact Registry
        run: gcloud builds submit --tag me-central1-docker.pkg.dev/notely-458516/notely-ar-repo/notely:latest .

      - name: migrate database
        run: npm run db:migrate

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image me-central1-docker.pkg.dev/notely-458516/notely-ar-repo/notely:latest --region me-central1 --allow-unauthenticated --project notely-458516 --max-instances=4
